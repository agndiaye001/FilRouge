services:
  backend:
    container_name: backend
    build: .
    ports:
      - "8000:8000"
    environment:
      - PG_USER=postgres
      - PG_PASSWORD=root
      - PG_DB=db_community
      - PG_HOST=db
      - PG_PORT=5432
    depends_on:
      - db
    networks:
      - backend_network
  db:
    container_name: db
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=db_community
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_network

volumes:
  pgdata: {}

networks:
  backend_network:
    driver: bridge